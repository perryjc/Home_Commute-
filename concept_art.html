<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        canvas{
			border: rgb(255, 0, 0) 10px solid;
			}
    </style>
</head>
<body>
    <p>
        The orange cars will be moving towards the blue and green cars, the different sides of the road in opposite directions.
        The boxes at the top will measure your score (left) and number of lives remaining (right)
        We may or may not add more stuff below the road.
        
    </p>
    <canvas id="canvas" width="1000" height="900">
		</canvas>
        <script>
				const canvas = document.getElementById("canvas");
				const ctx = canvas.getContext("2d");

                //draw the score box
                    //box
                ctx.fillStyle = "black";
                ctx.beginPath();                
                ctx.rect(0,0,200,100);
                ctx.stroke();
                    //numbers
                ctx.fillStyle = "black";
                ctx.beginPath();
                ctx.moveTo(50,60);
                ctx.lineTo(50,90);
                ctx.stroke();

                ctx.fillStyle = "black";
                ctx.beginPath();
                ctx.ellipse(70, 75, 10, 15, 0, 0, 2*Math.PI);
                ctx.stroke();

                ctx.fillStyle = "black";
                ctx.beginPath();
                ctx.ellipse(100, 75, 10, 15, 0, 0, 2*Math.PI);
                ctx.stroke();

                ctx.fillStyle = "black";
                ctx.beginPath();
                ctx.ellipse(130, 75, 10, 15, 0, 0, 2*Math.PI);
                ctx.stroke();
                    //words
                ctx.fillStyle = "black";
                ctx.beginPath();
                ctx.arc(100,30,10,0,2*Math.PI);    
                ctx.stroke();

                //draw the lives box
                    //box
                ctx.fillStyle = "black";
                ctx.beginPath();                
                ctx.rect(800,0,200,100);
                ctx.stroke();
                    //words
                ctx.fillStyle = "black";
                ctx.beginPath();
                ctx.moveTo(820,10);
                ctx.lineTo(820,40);
                ctx.stroke();

                ctx.fillStyle = "black";
                ctx.beginPath();
                ctx.moveTo(840,40);
                ctx.lineTo(820,40);
                ctx.stroke();

                ctx.fillStyle = "black";
                ctx.beginPath();
                ctx.moveTo(850,20);
                ctx.lineTo(850,41);
                ctx.stroke();

                ctx.fillStyle = "black";
                ctx.beginPath();
                ctx.moveTo(850,10);
                ctx.lineTo(850,13);
                ctx.stroke();

                 ctx.fillStyle = "black";
                ctx.beginPath();
                ctx.moveTo(860,20);
                ctx.lineTo(870,40);
                ctx.stroke();

                  ctx.fillStyle = "black";
                ctx.beginPath();
                ctx.moveTo(880,20);
                ctx.lineTo(870,40);
                ctx.stroke();


                    //hearts (sorry their upside down, I can't figure out how to fix that)
                        //tops
                ctx.fillStyle = "black"
				ctx.beginPath();
				ctx.arc(820,85,10,0,1*Math.PI);
				ctx.stroke();

                ctx.fillStyle = "black"
				ctx.beginPath();
				ctx.arc(840,85,10,0,1*Math.PI);
				ctx.stroke();

                ctx.fillStyle = "black"
				ctx.beginPath();
				ctx.arc(870,85,10,0,1*Math.PI);
				ctx.stroke();

                ctx.fillStyle = "black"
				ctx.beginPath();
				ctx.arc(890,85,10,0,1*Math.PI);
				ctx.stroke();

                ctx.fillStyle = "black"
				ctx.beginPath();
				ctx.arc(920,85,10,0,1*Math.PI);
				ctx.stroke();

                ctx.fillStyle = "black"
				ctx.beginPath();
				ctx.arc(940,85,10,0,1*Math.PI);
				ctx.stroke();

                ctx.fillStyle = "black"
				ctx.beginPath();
				ctx.arc(970,85,10,0,1*Math.PI);
				ctx.stroke();
                        //bottoms

                ctx.fillStyle = "black";
                ctx.beginPath();
                ctx.moveTo(830,55);
                ctx.lineTo(850,85);
                ctx.stroke();

                ctx.fillStyle = "black";
                ctx.beginPath();
                ctx.moveTo(830,55);
                ctx.lineTo(810,85);
                ctx.stroke();

                ctx.fillStyle = "black";
                ctx.beginPath();
                ctx.moveTo(880,55);
                ctx.lineTo(900,85);
                ctx.stroke();

                ctx.fillStyle = "black";
                ctx.beginPath();
                ctx.moveTo(880,55);
                ctx.lineTo(860,85);
                ctx.stroke();

                ctx.fillStyle = "black";
                ctx.beginPath();
                ctx.moveTo(930,55);
                ctx.lineTo(950,85);
                ctx.stroke();

                ctx.fillStyle = "black";
                ctx.beginPath();
                ctx.moveTo(930,55);
                ctx.lineTo(910,85);
                ctx.stroke();

                ctx.fillStyle = "black";
                ctx.beginPath();
                ctx.moveTo(980,55);
                ctx.lineTo(960,85);
                ctx.stroke();

                ctx.fillStyle = "black";
                ctx.beginPath();
                ctx.moveTo(980,55);
                ctx.lineTo(980,85);
                ctx.stroke();
                //draw the edge of the road
                ctx.fillStyle ="black";
                ctx.beginPath();
                ctx.rect(0,120,1000,650);
                ctx.stroke();

                //draw the upper middle line of the road
                ctx.fillStyle = "yellow";
                ctx.beginPath();
                ctx.moveTo(0,450);
                ctx.lineTo(50,450);
                ctx.stroke();

                ctx.fillStyle = "yellow";
                ctx.beginPath();
                ctx.moveTo(100,450);
                ctx.lineTo(150,450);
                ctx.stroke();

                ctx.fillStyle = "yellow";
                ctx.beginPath();
                ctx.moveTo(200,450);
                ctx.lineTo(250,450);
                ctx.stroke();

                ctx.fillStyle = "yellow";
                ctx.beginPath();
                ctx.moveTo(300,450);
                ctx.lineTo(350,450);
                ctx.stroke();

                ctx.fillStyle = "yellow";
                ctx.beginPath();
                ctx.moveTo(400,450);
                ctx.lineTo(450,450);
                ctx.stroke();

                ctx.fillStyle = "yellow";
                ctx.beginPath();
                ctx.moveTo(500,450);
                ctx.lineTo(550,450);
                ctx.stroke();

                ctx.fillStyle = "yellow";
                ctx.beginPath();
                ctx.moveTo(600,450);
                ctx.lineTo(650,450);
                ctx.stroke();

                ctx.fillStyle = "yellow";
                ctx.beginPath();
                ctx.moveTo(700,450);
                ctx.lineTo(750,450);
                ctx.stroke();

                ctx.fillStyle = "yellow";
                ctx.beginPath();
                ctx.moveTo(800,450);
                ctx.lineTo(850,450);
                ctx.stroke();

                ctx.fillStyle = "yellow";
                ctx.beginPath();
                ctx.moveTo(900,450);
                ctx.lineTo(950,450);
                ctx.stroke();
                
                //non-player cars

                ctx.fillStyle = "orange"
                ctx.fillRect(100, 300,70,30);

                ctx.fillStyle = "orange"
                ctx.fillRect(450, 200,70,30);

                ctx.fillStyle = "orange"
                ctx.fillRect(100, 480,70,30);

                ctx.fillStyle = "orange"
                ctx.fillRect(220, 550,70,30);

                ctx.fillStyle = "orange"
                ctx.fillRect(700, 350,70,30);

                ctx.fillStyle = "orange"
                ctx.fillRect(400, 500,70,30);

                ctx.fillStyle = "orange"
                ctx.fillRect(750, 200,70,30);

                ctx.fillStyle = "orange"
                ctx.fillRect(50, 200,70,30);

                ctx.fillStyle = "orange"
                ctx.fillRect(800, 700,70,30);

                ctx.fillStyle = "orange"
                ctx.fillRect(700, 670,70,30);

                ctx.fillStyle = "orange"
                ctx.fillRect(500, 360,70,30);

                ctx.fillStyle = "orange"
                ctx.fillRect(500, 590,70,30);

                ctx.fillStyle = "orange"
                ctx.fillRect(100, 700,70,30);

                //player 1 car

                ctx.fillStyle = "green"
                ctx.fillRect(100, 600,70,30);

                ctx.fillStyle = "green"
                ctx.fillRect(90, 595,40,40);

                ctx.fillStyle = "green"
                ctx.fillRect(170, 595,40,40);

                //player 2 car

                ctx.fillStyle = "blue"
                ctx.fillRect(850, 275,70,30);

                ctx.fillStyle = "blue"
                ctx.fillRect(835, 270,40,40);

                ctx.fillStyle = "blue"
                ctx.fillRect(915, 270,40,40);

        </script>        
</body>
</html>
